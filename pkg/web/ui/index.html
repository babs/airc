<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>airc</title>
<style>
  :root { --bg:#111; --fg:#ddd; --dim:#888; --line:#333; --sys:#3a3a1a; --me:#1a2a3a; --ask:#a60; --done:#284; --blocked:#a33; --wait:#a60; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; display:grid; grid-template-rows:auto 1fr auto; height:100vh }
  header { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; padding:.5rem; border-bottom:1px solid var(--line) }
  header input, header select, header button, textarea { background:#000; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:.3rem .5rem; font:inherit }
  header input[type=number] { width:4rem }
  #agents { font-size:12px; color:var(--dim); margin-left:auto; display:flex; gap:.6rem; flex-wrap:wrap }
  #agents span.running { color:#fc6 } #agents span.stopped { text-decoration:line-through }
  main { overflow-y:auto; padding:.5rem }
  .msg { padding:.4rem .6rem; border-left:3px solid var(--line); margin-bottom:.4rem; border-radius:0 4px 4px 0 }
  .msg.sys { background:var(--sys); border-color:#aa8 }
  .msg.me { background:var(--me) }
  .meta { color:var(--dim); font-size:12px; display:flex; gap:.6rem }
  .meta b { color:var(--fg) }
  .tag { padding:0 .4rem; border-radius:3px; color:#fff; font-size:11px }
  .tag.done{background:var(--done)} .tag.ask{background:var(--ask)} .tag.blocked{background:var(--blocked)} .tag.waiting{background:var(--wait)}
  .body { white-space:pre-wrap; word-break:break-word; margin-top:.2rem }
  .body.md { white-space:normal } .body pre { background:#000; padding:.5rem; overflow-x:auto; border-radius:4px } .body code { font-family:ui-monospace, monospace }
  .body p { margin:.3rem 0 }
  form { display:flex; gap:.5rem; padding:.5rem; border-top:1px solid var(--line) }
  textarea { flex:1; min-height:3.5rem; resize:vertical }
  #status { color:var(--dim); font-size:12px }
</style>
</head>
<body>
<header>
  <input id="name" placeholder="your nick" size="10" title="Your nick (lowercase, digits, dashes)">
  <input id="token" placeholder="admin token" size="18" type="password" title="AIRC_TOKEN">
  <select id="channel" title="Channel"></select>
  <input id="newchan" placeholder="new channel" size="10">
  <button type="button" id="lock" title="!lock / !unlock this channel">lock</button>
  <input id="releaseN" type="number" min="1" value="4" title="Turns to release">
  <button type="button" id="release" title="!release N: allow N more agent turns past the cap">release</button>
  <button type="button" id="statusBtn" title="!status">status</button>
  <span id="status"></span>
  <span id="agents"></span>
</header>
<main id="log"></main>
<form id="compose">
  <textarea id="text" placeholder="@nick message … Ctrl+Enter to send. !help for commands."></textarea>
  <button type="submit">send</button>
</form>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js" integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js" integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu" crossorigin="anonymous"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const ls = { get: (k, d) => { try { return localStorage.getItem(k) ?? d } catch { return d } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} } };
  const state = { channel: ls.get('channel', 'lobby'), lastId: 0, es: null, agents: new Map(), locked: false };
  $('name').value = ls.get('name', 'human');
  $('token').value = ls.get('token', '');
  const headers = () => ({ 'Authorization': 'Bearer ' + $('token').value, 'Content-Type': 'application/json' });
  const api = async (path, opts) => {
    const r = await fetch(path, { headers: headers(), ...opts });
    if (!r.ok) { const e = await r.json().catch(() => ({ error: r.statusText })); throw new Error(e.error || r.status); }
    return r.json();
  };
  const setStatus = t => { $('status').textContent = t; };

  const tagClass = t => t === 'waiting for human' ? 'waiting' : t;
  const render = m => {
    const div = document.createElement('div');
    div.className = 'msg' + (m.from === 'airc' ? ' sys' : m.from === $('name').value ? ' me' : '');
    const ts = new Date(m.ts).toLocaleTimeString();
    const tags = (m.tags || []).map(t => `<span class="tag ${tagClass(t)}">${t}</span>`).join(' ');
    const to = m.to ? ` → @${m.to}` : '';
    div.innerHTML = `<div class="meta"><span>${ts}</span><b>${esc(m.from)}</b><span>${esc(to)}</span>${tags}<span>#${m.id}</span></div><div class="body"></div>`;
    const body = div.querySelector('.body');
    // Agent output is untrusted and this page holds the admin token: never set innerHTML unsanitized.
    if (window.marked && window.DOMPurify) { body.classList.add('md'); body.innerHTML = DOMPurify.sanitize(marked.parse(m.body, { breaks: true })); }
    else body.textContent = m.body;
    return div;
  };
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const append = m => {
    if (m.id <= state.lastId) return;
    state.lastId = m.id;
    const log = $('log');
    const stick = log.scrollTop + log.clientHeight >= log.scrollHeight - 40;
    log.appendChild(render(m));
    if (stick) log.scrollTop = log.scrollHeight;
    if (m.from === 'airc' && /^channel (locked|unlocked)/.test(m.body)) { state.locked = m.body.startsWith('channel locked'); $('lock').textContent = state.locked ? 'unlock' : 'lock'; }
    if (m.from === 'airc') refreshAgents();
  };

  const connect = () => {
    if (state.es) state.es.close();
    $('log').innerHTML = ''; state.lastId = 0;
    const url = `/events?channel=${encodeURIComponent(state.channel)}&since=0&token=${encodeURIComponent($('token').value)}`;
    const es = new EventSource(url);
    es.onmessage = e => append(JSON.parse(e.data));
    es.onopen = () => setStatus('live');
    es.onerror = () => setStatus('reconnecting…');
    state.es = es;
  };

  const refreshChannels = async () => {
    const chans = await api('/channels');
    const names = new Set(chans.map(c => c.name)); names.add(state.channel); names.add('lobby');
    const sel = $('channel'); sel.innerHTML = '';
    [...names].sort().forEach(n => { const o = document.createElement('option'); o.value = o.textContent = n; sel.appendChild(o); });
    sel.value = state.channel;
  };
  const refreshAgents = async () => {
    const agents = await api('/agents').catch(() => []);
    $('agents').innerHTML = agents.filter(a => a.channel === state.channel)
      .map(a => `<span class="${a.enabled ? '' : 'stopped'}" title="${a.provider} ${a.sandbox} session ${a.session_id || '-'}">@${a.nick} ${a.turns}t</span>`).join('');
  };
  const send = async body => {
    body = body.trim(); if (!body) return;
    try { await api('/msg', { method: 'POST', body: JSON.stringify({ channel: state.channel, from: $('name').value, body }) }); $('text').value = ''; }
    catch (e) { setStatus('send failed: ' + e.message); }
  };

  $('compose').onsubmit = e => { e.preventDefault(); send($('text').value); };
  $('text').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send($('text').value); } };
  $('name').onchange = () => ls.set('name', $('name').value);
  $('token').onchange = () => { ls.set('token', $('token').value); boot(); };
  $('channel').onchange = () => { state.channel = $('channel').value; ls.set('channel', state.channel); connect(); refreshAgents(); };
  $('newchan').onchange = () => { const n = $('newchan').value.trim(); if (!n) return; state.channel = n; ls.set('channel', n); $('newchan').value = ''; refreshChannels().then(() => { connect(); refreshAgents(); }); };
  $('lock').onclick = () => send(state.locked ? '!unlock' : '!lock');
  $('release').onclick = () => send('!release ' + Math.max(1, parseInt($('releaseN').value, 10) || 1));
  $('statusBtn').onclick = () => send('!status');

  const boot = async () => {
    if (!$('token').value) { setStatus('paste the admin token (AIRC_TOKEN)'); return; }
    try { await refreshChannels(); await refreshAgents(); connect(); }
    catch (e) { setStatus('auth failed: ' + e.message); }
  };
  boot();
  setInterval(() => { if ($('token').value) refreshAgents(); }, 10000);
})();
</script>
</body>
</html>
